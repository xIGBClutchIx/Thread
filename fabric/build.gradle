plugins {
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/client-test-options.gradle')

base {
    archivesName = 'thread-fabric'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        thread {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'thread-gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
    gametest {
        java.srcDir rootProject.file('common/src/gametest/java')
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation project(':common')
    implementation project(':minecraft-26.2')
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraftVersion', project.minecraft_version
    inputs.property 'loaderVersion', project.loader_version
    inputs.property 'fabricApiVersion', project.fabric_api_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraftVersion: project.minecraft_version,
                loaderVersion: project.loader_version,
                fabricApiVersion: project.fabric_api_version)
    }
}

tasks.named('jar') {
    dependsOn ':common:classes', ':minecraft-26.2:classes'
    from project(':common').sourceSets.main.output
    from project(':minecraft-26.2').sourceSets.main.output
}

tasks.named('sourcesJar') {
    from project(':common').sourceSets.main.allSource
    from project(':minecraft-26.2').sourceSets.main.allSource
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('clientClasses')
}

tasks.named('compileGametestJava') {
    dependsOn tasks.named('clientClasses')
}

def clientGameTestRunDirectory = layout.buildDirectory.dir('run/clientGameTest')
tasks.named('runClientGameTest') {
    doFirst {
        project.ext.writeMutedClientTestOptions(clientGameTestRunDirectory.get().asFile)
    }
}

// Applied scripts do not inherit Loom plugin classes on their compilation classpath.
ext.productionClientTaskType = net.fabricmc.loom.task.prod.ClientProductionRunTask

apply from: rootProject.file('gradle/packaged-tests.gradle')
