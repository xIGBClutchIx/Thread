name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Validate and release
        runs-on: ubuntu-latest
        steps:
            - name: Check out tagged sources
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Verify Gradle wrapper permissions
              run: chmod +x gradlew

            - name: Run clean build and artifact gate
              run: >-
                  ./gradlew --no-daemon clean spotlessCheck check build
                  verifyReleaseVersion releaseBundle -PreleaseTag="${GITHUB_REF_NAME}"

            - name: Verify reproducible release JARs
              shell: bash
              run: |
                  find build/release -maxdepth 1 -type f -name '*.jar' -print0 \
                    | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/thread-release-first.sha256"
                  ./gradlew --no-daemon clean releaseBundle
                  find build/release -maxdepth 1 -type f -name '*.jar' -print0 \
                    | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/thread-release-second.sha256"
                  diff -u "${RUNNER_TEMP}/thread-release-first.sha256" \
                    "${RUNNER_TEMP}/thread-release-second.sha256"

            - name: Export supported Minecraft matrix
              run: ./gradlew --no-daemon writeSupportedMinecraftVersions

            - name: Test packaged Fabric artifact with MCP enabled
              run: |
                  while IFS= read -r version; do
                    ./gradlew --no-daemon ":loaders:fabric:${version}:runRestartProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test packaged Fabric artifact with MCP disabled
              run: |
                  while IFS= read -r version; do
                    ./gradlew --no-daemon ":loaders:fabric:${version}:runMcpDisabledProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test packaged NeoForge artifact with MCP enabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:neoforge:${version}:verifyNeoForgeRestartProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test packaged NeoForge artifact with MCP disabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:neoforge:${version}:verifyNeoForgeMcpDisabledProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test packaged Forge artifact with MCP enabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:forge:${version}:verifyForgeRestartProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test packaged Forge artifact with MCP disabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:forge:${version}:verifyForgeMcpDisabledProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test universal artifact on Fabric with MCP enabled
              run: |
                  while IFS= read -r version; do
                    ./gradlew --no-daemon ":loaders:fabric:${version}:runUniversalRestartProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test universal artifact on Fabric with MCP disabled
              run: |
                  while IFS= read -r version; do
                    ./gradlew --no-daemon ":loaders:fabric:${version}:runUniversalMcpDisabledProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test universal artifact on NeoForge with MCP enabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:neoforge:${version}:verifyUniversalNeoForgeRestartProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test universal artifact on NeoForge with MCP disabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:neoforge:${version}:verifyUniversalNeoForgeMcpDisabledProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test universal artifact on Forge with MCP enabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:forge:${version}:verifyUniversalForgeRestartProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Test universal artifact on Forge with MCP disabled
              run: |
                  while IFS= read -r version; do
                    xvfb-run -a ./gradlew --no-daemon ":loaders:forge:${version}:verifyUniversalForgeMcpDisabledProductionClientGameTest"
                  done < build/matrix/supported-minecraft-versions.txt

            - name: Upload release bundle
              uses: actions/upload-artifact@v4
              with:
                  name: thread-${{ github.ref_name }}
                  path: build/release/*
                  if-no-files-found: error

            - name: Create or update GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                    gh release upload "${GITHUB_REF_NAME}" build/release/* --clobber
                  else
                    gh release create "${GITHUB_REF_NAME}" build/release/* \
                      --verify-tag \
                      --generate-notes \
                      --title "Thread ${GITHUB_REF_NAME#v}"
                  fi
