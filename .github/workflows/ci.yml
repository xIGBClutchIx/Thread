name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and verify
        runs-on: ubuntu-latest
        steps:
            - name: Check out sources
              uses: actions/checkout@v7

            - name: Set up Thread build
              uses: ./.github/actions/setup-thread

            - name: Run quality gate
              run: ./gradlew --no-daemon clean spotlessCheck check build releaseBundle

            - name: Export supported Minecraft matrix
              run: ./gradlew --no-daemon writeSupportedMinecraftVersions

            - name: Verify packaged clients
              uses: ./.github/actions/verify-packaged-clients

            - name: Upload failure reports
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: build-reports
                  path: |
                      build/reports/
                      common/build/reports/
                      minecraft/*/build/reports/
                      loaders/*/*/build/reports/
                      build/run/**/logs/
                      build/run/**/crash-reports/
                  if-no-files-found: ignore

            - name: Upload development mod
              if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v7
              with:
                  name: thread-${{ github.sha }}
                  path: build/release/*.jar
                  if-no-files-found: error
