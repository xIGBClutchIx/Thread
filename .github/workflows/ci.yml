name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and verify
        runs-on: ubuntu-latest
        steps:
            - name: Check out sources
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Verify Gradle wrapper permissions
              run: chmod +x gradlew

            - name: Run quality gate
              run: ./gradlew --no-daemon clean spotlessCheck check build releaseBundle

            - name: Test packaged Fabric mod with MCP enabled
              run: |
                  ./gradlew --no-daemon :loaders:fabric:26.2:runRestartProductionClientGameTest
                  ./gradlew --no-daemon :loaders:fabric:26.1.2:runRestartProductionClientGameTest

            - name: Test packaged Fabric mod with MCP disabled
              run: |
                  ./gradlew --no-daemon :loaders:fabric:26.2:runMcpDisabledProductionClientGameTest
                  ./gradlew --no-daemon :loaders:fabric:26.1.2:runMcpDisabledProductionClientGameTest

            - name: Test packaged NeoForge mod with MCP enabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.2:verifyNeoForgeRestartProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.1.2:verifyNeoForgeRestartProductionClientGameTest

            - name: Test packaged NeoForge mod with MCP disabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.2:verifyNeoForgeMcpDisabledProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.1.2:verifyNeoForgeMcpDisabledProductionClientGameTest

            - name: Test packaged Forge mod with MCP enabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.2:verifyForgeRestartProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.1.2:verifyForgeRestartProductionClientGameTest

            - name: Test packaged Forge mod with MCP disabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.2:verifyForgeMcpDisabledProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.1.2:verifyForgeMcpDisabledProductionClientGameTest

            - name: Test universal mod on Fabric with MCP enabled
              run: |
                  ./gradlew --no-daemon :loaders:fabric:26.2:runUniversalRestartProductionClientGameTest
                  ./gradlew --no-daemon :loaders:fabric:26.1.2:runUniversalRestartProductionClientGameTest

            - name: Test universal mod on Fabric with MCP disabled
              run: |
                  ./gradlew --no-daemon :loaders:fabric:26.2:runUniversalMcpDisabledProductionClientGameTest
                  ./gradlew --no-daemon :loaders:fabric:26.1.2:runUniversalMcpDisabledProductionClientGameTest

            - name: Test universal mod on NeoForge with MCP enabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.2:verifyUniversalNeoForgeRestartProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.1.2:verifyUniversalNeoForgeRestartProductionClientGameTest

            - name: Test universal mod on NeoForge with MCP disabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.2:verifyUniversalNeoForgeMcpDisabledProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:neoforge:26.1.2:verifyUniversalNeoForgeMcpDisabledProductionClientGameTest

            - name: Test universal mod on Forge with MCP enabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.2:verifyUniversalForgeRestartProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.1.2:verifyUniversalForgeRestartProductionClientGameTest

            - name: Test universal mod on Forge with MCP disabled
              run: |
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.2:verifyUniversalForgeMcpDisabledProductionClientGameTest
                  xvfb-run -a ./gradlew --no-daemon :loaders:forge:26.1.2:verifyUniversalForgeMcpDisabledProductionClientGameTest

            - name: Upload failure reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-reports
                  path: |
                      build/reports/
                      common/build/reports/
                      minecraft/26.1.2/build/reports/
                      minecraft/26.2/build/reports/
                      loaders/fabric/26.1.2/build/reports/
                      loaders/fabric/26.2/build/reports/
                      loaders/neoforge/26.1.2/build/reports/
                      loaders/neoforge/26.2/build/reports/
                      loaders/forge/26.1.2/build/reports/
                      loaders/forge/26.2/build/reports/
                      build/run/**/logs/
                      build/run/**/crash-reports/
                  if-no-files-found: ignore

            - name: Upload development mod
              if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                  name: thread-${{ github.sha }}
                  path: build/release/*.jar
                  if-no-files-found: error
