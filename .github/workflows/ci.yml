name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and verify
        runs-on: ubuntu-latest
        steps:
            - name: Check out sources
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Verify Gradle wrapper permissions
              run: chmod +x gradlew

            - name: Run quality gate
              run: ./gradlew --no-daemon clean spotlessCheck check build releaseBundle

            - name: Test packaged Fabric mod with MCP enabled
              run: >-
                  ./gradlew --no-daemon
                  runProductionClientGameTest runRestartProductionClientGameTest

            - name: Test packaged Fabric mod with MCP disabled
              run: ./gradlew --no-daemon runMcpDisabledProductionClientGameTest

            - name: Test packaged NeoForge mod with MCP enabled
              run: >-
                  xvfb-run -a ./gradlew --no-daemon
                  verifyNeoForgeRestartProductionClientGameTest

            - name: Test packaged NeoForge mod with MCP disabled
              run: >-
                  xvfb-run -a ./gradlew --no-daemon
                  verifyNeoForgeMcpDisabledProductionClientGameTest

            - name: Test packaged Forge mod with MCP enabled
              run: >-
                  xvfb-run -a ./gradlew --no-daemon
                  verifyForgeRestartProductionClientGameTest

            - name: Test packaged Forge mod with MCP disabled
              run: >-
                  xvfb-run -a ./gradlew --no-daemon
                  verifyForgeMcpDisabledProductionClientGameTest

            - name: Upload failure reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-reports
                  path: |
                      build/reports/
                      common/build/reports/
                      fabric/build/reports/
                      neoforge/build/reports/
                      forge/build/reports/
                      build/run/**/logs/
                      build/run/**/crash-reports/
                  if-no-files-found: ignore

            - name: Upload development mod
              if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                  name: thread-${{ github.sha }}
                  path: build/release/*.jar
                  if-no-files-found: error
