name: Set up Thread build
description: Sets up the Java and Gradle environment used by Thread workflows.

runs:
    using: composite
    steps:
        - name: Set up Java
          uses: actions/setup-java@v5
          with:
              distribution: temurin
              java-version: "25"

        - name: Set up Gradle
          uses: gradle/actions/setup-gradle@v6

        - name: Verify Gradle wrapper permissions
          shell: bash
          run: chmod +x gradlew
