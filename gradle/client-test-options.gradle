// Client proofs need a real window and OpenGL context, but their isolated instances should not
// steal fullscreen focus, pause when focus changes, or emit audio during local verification.
ext.writeMutedClientTestOptions = { File runDirectory ->
    def versionConfig = rootProject.ext.threadBuildMatrix.versions[
            project.ext.threadMinecraftVersion]
    if (versionConfig == null || versionConfig.clientOptionsHeader == null) {
        throw new GradleException(
                "Missing client-test options fixture for ${project.ext.threadMinecraftVersion}")
    }
    runDirectory.mkdirs()
    new File(runDirectory, 'options.txt').setText(
            versionConfig.clientOptionsHeader +
                    'onboardAccessibility:false\n' +
                    'fullscreen:false\n' +
                    'pauseOnLostFocus:false\n' +
                    'soundCategory_master:0.0\n',
            'UTF-8')
}
