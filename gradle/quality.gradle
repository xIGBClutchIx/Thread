def threadJavaTargets = ['common/src/**/*.java', 'minecraft/shared/src/**/*.java']
threadJavaTargets.addAll(
        rootProject.ext.threadBuildMatrix.versions.keySet().collect {
            minecraftVersion -> "minecraft/${minecraftVersion}/src/**/*.java".toString()
        })
threadJavaTargets.addAll(
        rootProject.ext.threadBuildMatrix.loaders.collect {
            loader -> "loaders/${loader}/src/**/*.java".toString()
        })
threadJavaTargets.addAll(
        rootProject.ext.threadBuildMatrix.loaders.collectMany { loader ->
            rootProject.ext.threadBuildMatrix.versions.keySet().collect { minecraftVersion ->
                "loaders/${loader}/${minecraftVersion}/src/**/*.java".toString()
            }
        })

spotless {
    java {
        target(*threadJavaTargets)
        googleJavaFormat(project.google_java_format_version)
        removeUnusedImports()
        forbidWildcardImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'repositoryFiles', {
        target '*.gradle', 'gradle/**/*.gradle', '*.properties', '*.md', '*.json', '*.yml',
                '*.yaml', '.github/**/*.yml', '.github/**/*.yaml', 'common/**/*.gradle',
                'minecraft/**/*.gradle', 'loaders/**/*.gradle',
                'config/**/*.xml', 'docs/**/*.md', 'common/src/**/*.json',
                'minecraft/**/*.json', 'loaders/**/*.json', 'loaders/**/*.toml'
        targetExclude '.gradle/**', '**/build/**', 'run/**'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

def threadModuleProjects = rootProject.ext.threadModulePaths.collect { project(it) }
def minimumJavaVersion = rootProject.ext.threadBuildMatrix.versions.values()
        .collect { it.javaVersion }
        .min()

configure(threadModuleProjects) { moduleProject ->
    def versionConfig = rootProject.ext.threadBuildMatrix.versions[moduleProject.name]
    def threadJavaVersion = versionConfig == null ? minimumJavaVersion : versionConfig.javaVersion
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(threadJavaVersion)
        }
        withSourcesJar()
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = threadJavaVersion
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        // Keep structural doclint without requiring boilerplate tags on trivial accessors and records.
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    checkstyle {
        toolVersion = rootProject.checkstyle_version
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
            rename { 'LICENSE_thread' }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('javadoc')
    }
}

tasks.named('clean') {
    dependsOn threadModuleProjects.collect { it.tasks.named('clean') }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn threadModuleProjects.collect { it.tasks.named('check') }
}

tasks.named('build') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn threadModuleProjects.collect { it.tasks.named('build') }
}
