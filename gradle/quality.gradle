spotless {
    java {
        target 'common/src/**/*.java', 'fabric/src/**/*.java', 'neoforge/src/**/*.java',
                'forge/src/**/*.java'
        googleJavaFormat(project.google_java_format_version)
        removeUnusedImports()
        forbidWildcardImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'repositoryFiles', {
        target '*.gradle', 'gradle/**/*.gradle', '*.properties', '*.md', '*.json', '*.yml',
                '*.yaml', '.github/**/*.yml', '.github/**/*.yaml', 'common/**/*.gradle',
                'fabric/**/*.gradle', 'neoforge/**/*.gradle', 'forge/**/*.gradle',
                'config/**/*.xml', 'docs/**/*.md',
                'common/src/**/*.json', 'fabric/src/**/*.json', 'neoforge/src/**/*.json',
                'forge/src/**/*.json', 'neoforge/src/**/*.toml', 'forge/src/**/*.toml'
        targetExclude '.gradle/**', '**/build/**', 'run/**'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        // Keep structural doclint without requiring boilerplate tags on trivial accessors and records.
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    checkstyle {
        toolVersion = rootProject.checkstyle_version
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.named('check') {
        dependsOn tasks.named('javadoc')
    }
}

tasks.named('clean') {
    dependsOn subprojects.collect { it.tasks.named('clean') }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn subprojects.collect { it.tasks.named('check') }
}

tasks.named('build') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn subprojects.collect { it.tasks.named('build') }
}
