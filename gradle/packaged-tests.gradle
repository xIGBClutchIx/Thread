def productionClientTaskType = project.ext.productionClientTaskType
def gametestJar = tasks.register('gametestJar', Jar) {
    group = 'build'
    description = 'Packages the isolated client game-test harness.'
    dependsOn tasks.named('gametestClasses')
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

def minecraftVersion = project.ext.threadMinecraftVersion
def versionConfig = rootProject.ext.threadBuildMatrix.versions[minecraftVersion]
def packagedGametestJar = gametestJar
if (versionConfig.requiresMappings) {
    packagedGametestJar = tasks.register('remapGametestJar', project.ext.remapJarTaskType) {
        group = 'build'
        description = 'Remaps the isolated client game-test harness for production.'
        dependsOn gametestJar
        inputFile.set(gametestJar.flatMap { it.archiveFile })
        archiveClassifier.set('gametest-remapped')
        addNestedDependencies.set(false)
    }
}

def runPrefix = "run/minecraft-${minecraftVersion}/fabric"
def productionRunDirectory = rootProject.layout.buildDirectory.dir(
        "${runPrefix}ProductionClientGameTest")
def expectedMinecraftVersionArgument =
        "-Dthread.gametest.expectedMinecraftVersion=${minecraftVersion}"
def resetRunDirectory = { File runDirectory ->
    if (runDirectory.exists() && !runDirectory.deleteDir()) {
        throw new GradleException("Could not reset packaged-client directory: ${runDirectory}")
    }
}
def writeThreadTestConfig = { directoryProvider, String source ->
    def configFile = directoryProvider.get().file('config/thread.json').asFile
    configFile.parentFile.mkdirs()
    configFile.setText(source, 'UTF-8')
}

tasks.register('prepareFreshProductionClientGameTest') {
    mustRunAfter rootProject.tasks.named('clean')
    dependsOn tasks.named('build'), packagedGametestJar
    outputs.upToDateWhen { false }
    doLast {
        def runDirectory = productionRunDirectory.get().asFile
        resetRunDirectory(runDirectory)
        project.ext.writeMutedClientTestOptions(runDirectory)
    }
}

tasks.register(
        'runProductionClientGameTest',
        productionClientTaskType) {
    group = 'verification'
    description = 'Runs the client game test against the packaged mod.'
    dependsOn tasks.named('prepareFreshProductionClientGameTest')
    mods.from(packagedGametestJar.flatMap { it.archiveFile })
    jvmArgs.addAll('-Dfabric.client.gametest', expectedMinecraftVersionArgument)
    runDir = productionRunDirectory.get().asFile
    // Loom owns runDir as task output and may clean it after dependency preparation. Restaging in
    // the production task keeps first-run fixtures deterministic from a clean checkout.
    doFirst {
        project.ext.writeMutedClientTestOptions(productionRunDirectory.get().asFile)
    }
}

def restartMcpPort = 25_581

tasks.register('prepareRestartProductionClientGameTest') {
    dependsOn tasks.named('runProductionClientGameTest')
    outputs.upToDateWhen { false }
    doLast {
        writeThreadTestConfig(
                productionRunDirectory,
                "{\n  \"schemaVersion\": 1,\n  \"mcpPort\": ${restartMcpPort}\n}\n")
    }
}

tasks.register(
        'runRestartProductionClientGameTest',
        productionClientTaskType) {
    group = 'verification'
    description = 'Restarts the packaged client with an existing config.'
    dependsOn tasks.named('build'), packagedGametestJar,
            tasks.named('prepareRestartProductionClientGameTest')
    mods.from(packagedGametestJar.flatMap { it.archiveFile })
    jvmArgs.addAll(
            '-Dfabric.client.gametest',
            expectedMinecraftVersionArgument,
            "-Dthread.gametest.expectedMcpPort=${restartMcpPort}")
    runDir = productionRunDirectory.get().asFile
    doFirst {
        project.ext.writeMutedClientTestOptions(productionRunDirectory.get().asFile)
        writeThreadTestConfig(
                productionRunDirectory,
                "{\n  \"schemaVersion\": 1,\n  \"mcpPort\": ${restartMcpPort}\n}\n")
    }
}

