def releaseDirectory = layout.buildDirectory.dir('release')
def semanticVersionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/

tasks.register('validateReleaseVersion') {
    group = 'verification'
    description = 'Validates the configured release version.'
    doLast {
        if (!(project.version.toString() ==~ semanticVersionPattern)) {
            throw new GradleException(
                    "Configured mod_version '${project.version}' must use MAJOR.MINOR.PATCH.")
        }
    }
}

tasks.register('verifyReleaseVersion') {
    group = 'verification'
    description = 'Verifies that the release tag matches the configured mod version.'
    dependsOn tasks.named('validateReleaseVersion')
    doLast {
        def actualTag = providers.gradleProperty('releaseTag')
                .orElse(providers.environmentVariable('GITHUB_REF_NAME'))
                .getOrNull()
        def expectedTag = "v${project.version}"
        if (actualTag == null) {
            throw new GradleException('Supply -PreleaseTag=v<version> or GITHUB_REF_NAME.')
        }
        if (!(actualTag ==~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)) {
            throw new GradleException("Release tag '${actualTag}' must use vMAJOR.MINOR.PATCH.")
        }
        if (actualTag != expectedTag) {
            throw new GradleException("Release tag ${actualTag} does not match ${expectedTag}.")
        }
    }
}

def releaseMatrices = []
threadBuildMatrix.versions.each { minecraftVersion, versionConfig ->
    releaseMatrices.add([
            taskSuffix          : versionConfig.taskSuffix,
            minecraftVersion    : minecraftVersion,
            javaVersion         : versionConfig.javaVersion,
            requiresMappings    : versionConfig.requiresMappings,
            fabricLoaderVersion : versionConfig.fabricLoader,
            fabricApiVersion    : versionConfig.fabricApi,
            neoForgeVersion     : versionConfig.neoForge,
            forgeVersion        : versionConfig.forge,
            fabricProject       : project(":loaders:fabric:${minecraftVersion}"),
            neoForgeProject     : project(":loaders:neoforge:${minecraftVersion}"),
            forgeProject        : project(":loaders:forge:${minecraftVersion}"),
            archiveVersion      : minecraftVersion,
            capabilityEntry     : versionConfig.capabilityEntry,
            otherCapabilityEntries: threadBuildMatrix.versions
                    .findAll { candidateVersion, ignored -> candidateVersion != minecraftVersion }
                    .values()
                    .collect { it.capabilityEntry },
            universalTask       : threadUniversalJarTasks[minecraftVersion],
            universalJar        : threadUniversalJarTasks[minecraftVersion]
                    .flatMap { it.archiveFile }
    ])
}

releaseMatrices.each { matrix ->
    matrix.fabricJarTaskPath = "${matrix.fabricProject.path}:" +
            (matrix.requiresMappings ? 'remapJar' : 'jar')
    matrix.fabricJar = matrix.fabricProject.layout.buildDirectory.file(
            "libs/thread-fabric-${matrix.minecraftVersion}-${project.version}.jar")
    matrix.neoForgeJar = matrix.neoForgeProject.tasks.named('jar', Jar).flatMap { it.archiveFile }
    matrix.forgeJar = matrix.forgeProject.tasks.named('jar', Jar).flatMap { it.archiveFile }
    matrix.fabricReleaseJarName =
            "thread-fabric-${matrix.archiveVersion}-${project.version}.jar"
    matrix.neoForgeReleaseJarName =
            "thread-neoforge-${matrix.archiveVersion}-${project.version}.jar"
    matrix.forgeReleaseJarName =
            "thread-forge-${matrix.archiveVersion}-${project.version}.jar"
    matrix.universalReleaseJarName =
            "thread-universal-${matrix.archiveVersion}-${project.version}.jar"
}

def requiredSharedEntries = [
        'META-INF/LICENSE_thread',
        'me/clutchy/thread/core/integration/ThreadIntegration.class',
        'me/clutchy/thread/core/integration/ThreadIntegrationCandidateProvider.class',
        'me/clutchy/thread/core/integration/IntegrationCandidateCatalog.class',
        'me/clutchy/thread/core/integration/extension/IntegrationExtensionPoint.class',
        'me/clutchy/thread/core/integration/extension/IntegrationRecipeProvider.class',
        'me/clutchy/thread/minecraft/MinecraftRuntime.class',
        'me/clutchy/thread/platform/minecraft/integration/MinecraftIntegrationExtensionPoints.class',
        'me/clutchy/thread/platform/minecraft/game/MinecraftGameProvider.class',
        'me/clutchy/thread/runtime/ThreadRuntime.class',
        'me/clutchy/thread/transport/mcp/McpHttpServer.class'
]

def validateArchiveShape = {
    Set<String> entries,
    Map<String, Object> matrix,
    String ownPrefix,
    Set<String> forbiddenPrefixes ->
    (requiredSharedEntries + matrix.capabilityEntry).each { entry ->
        if (!entries.contains(entry)) {
            throw new GradleException("Runtime JAR is missing ${entry}")
        }
    }
    if (matrix.otherCapabilityEntries.any { entries.contains(it) }) {
        throw new GradleException('Runtime JAR contains another Minecraft version implementation.')
    }
    if (entries.any { it.contains('/gametest/') || it.endsWith('.java') }
            || entries.any { entry -> forbiddenPrefixes.any { prefix -> entry.startsWith(prefix) } }) {
        throw new GradleException(
                'Runtime JAR contains test, source, or other-loader implementation content.')
    }
    if (!ownPrefix.isEmpty()) {
        def integrationPrefix = "${ownPrefix}integration/"
        if (entries.any { it.startsWith(integrationPrefix)
            && it.substring(integrationPrefix.length()).contains('/') }) {
            throw new GradleException('Runtime JAR contains bundled third-party integration content.')
        }
    }
}

def releaseVerificationTasks = []
releaseMatrices.each { matrix ->
    def fabricTask = tasks.register("verify${matrix.taskSuffix}FabricReleaseArtifact") {
        group = 'verification'
        description = "Validates the Minecraft ${matrix.minecraftVersion} Fabric JAR."
        dependsOn matrix.fabricJarTaskPath, tasks.named('validateReleaseVersion')
        inputs.file(matrix.fabricJar)
        doLast {
            def jarFile = matrix.fabricJar.get().asFile
            if (jarFile.name != matrix.fabricReleaseJarName) {
                throw new GradleException("Unexpected Fabric runtime JAR name: ${jarFile.name}")
            }
            new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
                def entries = archive.entries().collect { it.name }.toSet()
                validateArchiveShape(
                        entries,
                        matrix,
                        'me/clutchy/thread/platform/fabric/',
                        [
                                'me/clutchy/thread/platform/neoforge/',
                                'me/clutchy/thread/platform/forge/'
                        ] as Set)
                if (!entries.contains('fabric.mod.json')
                        || !entries.contains(
                            'me/clutchy/thread/platform/fabric/ThreadFabricClient.class')
                        || entries.contains('META-INF/neoforge.mods.toml')) {
                    throw new GradleException(
                            'Fabric runtime identity or loader isolation is incorrect.')
                }
                def metadata = new groovy.json.JsonSlurper().parse(
                        archive.getInputStream(archive.getEntry('fabric.mod.json')), 'UTF-8')
                if (metadata.id != 'thread'
                        || metadata.version != project.version.toString()
                        || metadata.license != 'MIT'
                        || metadata.environment != 'client'
                        || metadata.entrypoints != [
                            client: ['me.clutchy.thread.platform.fabric.ThreadFabricClient']
                        ]) {
                    throw new GradleException(
                            'Fabric runtime metadata identity/version is incorrect.')
                }
                if (metadata.depends != [
                        fabricloader: ">=${matrix.fabricLoaderVersion}",
                        minecraft   : "=${matrix.minecraftVersion}",
                        java        : ">=${matrix.javaVersion}",
                        'fabric-api': ">=${matrix.fabricApiVersion}"
                ]) {
                    throw new GradleException('Fabric runtime dependency metadata is incorrect.')
                }
            }
        }
    }

    def neoForgeTask = tasks.register("verify${matrix.taskSuffix}NeoForgeReleaseArtifact") {
        group = 'verification'
        description = "Validates the Minecraft ${matrix.minecraftVersion} NeoForge JAR."
        dependsOn matrix.neoForgeProject.tasks.named('jar'), tasks.named('validateReleaseVersion')
        inputs.file(matrix.neoForgeJar)
        doLast {
            def jarFile = matrix.neoForgeJar.get().asFile
            if (jarFile.name != matrix.neoForgeReleaseJarName) {
                throw new GradleException("Unexpected NeoForge runtime JAR name: ${jarFile.name}")
            }
            new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
                def entries = archive.entries().collect { it.name }.toSet()
                validateArchiveShape(
                        entries,
                        matrix,
                        'me/clutchy/thread/platform/neoforge/',
                        [
                                'me/clutchy/thread/platform/fabric/',
                                'me/clutchy/thread/platform/forge/'
                        ] as Set)
                def metadataEntry = archive.getEntry('META-INF/neoforge.mods.toml')
                if (metadataEntry == null
                        || !entries.contains(
                            'me/clutchy/thread/platform/neoforge/ThreadNeoForgeClient.class')
                        || entries.contains('fabric.mod.json')) {
                    throw new GradleException(
                            'NeoForge runtime identity or loader isolation is incorrect.')
                }
                def metadata = archive.getInputStream(metadataEntry).getText('UTF-8')
                [
                        'modLoader="javafml"',
                        'license="MIT"',
                        'modId="thread"',
                        "version=\"${project.version}\"",
                        'modId="neoforge"',
                        "versionRange=\"[${matrix.neoForgeVersion},)\"",
                        'modId="minecraft"',
                        "versionRange=\"[${matrix.minecraftVersion}]\"",
                        'side="CLIENT"'
                ].each { expected ->
                    if (!metadata.contains(expected)) {
                        throw new GradleException("NeoForge metadata is missing ${expected}")
                    }
                }
            }
        }
    }

    def forgeTask = tasks.register("verify${matrix.taskSuffix}ForgeReleaseArtifact") {
        group = 'verification'
        description = "Validates the Minecraft ${matrix.minecraftVersion} Forge JAR."
        dependsOn matrix.forgeProject.tasks.named('jar'), tasks.named('validateReleaseVersion')
        inputs.file(matrix.forgeJar)
        doLast {
            def jarFile = matrix.forgeJar.get().asFile
            if (jarFile.name != matrix.forgeReleaseJarName) {
                throw new GradleException("Unexpected Forge runtime JAR name: ${jarFile.name}")
            }
            new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
                def entries = archive.entries().collect { it.name }.toSet()
                validateArchiveShape(
                        entries,
                        matrix,
                        'me/clutchy/thread/platform/forge/',
                        [
                                'me/clutchy/thread/platform/fabric/',
                                'me/clutchy/thread/platform/neoforge/'
                        ] as Set)
                def metadataEntry = archive.getEntry('META-INF/mods.toml')
                if (metadataEntry == null
                        || !entries.contains(
                            'me/clutchy/thread/platform/forge/ThreadForgeClient.class')
                        || entries.contains('fabric.mod.json')
                        || entries.contains('META-INF/neoforge.mods.toml')) {
                    throw new GradleException(
                            'Forge runtime identity or loader isolation is incorrect.')
                }
                def forgeLoaderVersion = matrix.forgeVersion.split('-', 2)[1]
                def metadata = archive.getInputStream(metadataEntry).getText('UTF-8')
                [
                        'modLoader="javafml"',
                        'license="MIT"',
                        'clientSideOnly=true',
                        'modId="thread"',
                        "version=\"${project.version}\"",
                        'modId="forge"',
                        'mandatory=true',
                        "versionRange=\"[${forgeLoaderVersion},)\"",
                        'modId="minecraft"',
                        "versionRange=\"[${matrix.minecraftVersion}]\"",
                        'side="CLIENT"'
                ].each { expected ->
                    if (!metadata.contains(expected)) {
                        throw new GradleException("Forge metadata is missing ${expected}")
                    }
                }
            }
        }
    }

    def universalTask = tasks.register("verify${matrix.taskSuffix}UniversalReleaseArtifact") {
        group = 'verification'
        description = "Validates the Minecraft ${matrix.minecraftVersion} universal JAR."
        dependsOn matrix.universalTask, tasks.named('validateReleaseVersion')
        inputs.file(matrix.universalJar)
        doLast {
            def jarFile = matrix.universalJar.get().asFile
            if (jarFile.name != matrix.universalReleaseJarName) {
                throw new GradleException("Unexpected universal runtime JAR name: ${jarFile.name}")
            }
            new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
                def entryNames = archive.entries().collect { it.name }
                def entries = entryNames.toSet()
                if (entryNames.size() != entries.size()) {
                    throw new GradleException('Universal runtime JAR contains duplicate entries.')
                }
                validateArchiveShape(entries, matrix, '', [] as Set)
                [
                        'fabric.mod.json',
                        'META-INF/neoforge.mods.toml',
                        'META-INF/mods.toml',
                        'pack.mcmeta',
                        'me/clutchy/thread/platform/fabric/ThreadFabricClient.class',
                        'me/clutchy/thread/platform/neoforge/ThreadNeoForgeClient.class',
                        'me/clutchy/thread/platform/forge/ThreadForgeClient.class'
                ].each { entry ->
                    if (!entries.contains(entry)) {
                        throw new GradleException("Universal runtime JAR is missing ${entry}")
                    }
                }
                def relocatedFabricPrefix =
                        'me/clutchy/thread/platform/fabric/intermediary/'
                if (matrix.requiresMappings) {
                    [
                            relocatedFabricPrefix + 'minecraft/MinecraftRuntime.class',
                            relocatedFabricPrefix +
                                    'platform/game/MinecraftGameProvider.class'
                    ].each { entry ->
                        if (!entries.contains(entry)) {
                            throw new GradleException(
                                    "Mapped universal runtime JAR is missing ${entry}")
                        }
                    }
                    def fabricEntrypoint = new String(
                            archive.getInputStream(archive.getEntry(
                                    'me/clutchy/thread/platform/fabric/ThreadFabricClient.class'))
                                    .readAllBytes(),
                            java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (!fabricEntrypoint.contains(
                            relocatedFabricPrefix + 'minecraft/MinecraftRuntime')) {
                        throw new GradleException(
                                'Mapped universal Fabric entrypoint does not use its relocated runtime.')
                    }
                } else if (entries.any { it.startsWith(relocatedFabricPrefix) }) {
                    throw new GradleException(
                            'Unobfuscated universal runtime unexpectedly contains relocated Fabric classes.')
                }
                [
                        'me/clutchy/thread/platform/fabric/',
                        'me/clutchy/thread/platform/neoforge/',
                        'me/clutchy/thread/platform/forge/'
                ].each { prefix ->
                    def integrationPrefix = "${prefix}integration/"
                    if (entries.any { it.startsWith(integrationPrefix)
                        && it.substring(integrationPrefix.length()).contains('/') }) {
                        throw new GradleException(
                                'Universal runtime JAR contains bundled third-party integration content.')
                    }
                }

                def forbiddenSharedReferences = [
                        'net/fabricmc/',
                        'net/neoforged/',
                        'net/minecraftforge/',
                        'me/clutchy/thread/platform/fabric/',
                        'me/clutchy/thread/platform/neoforge/',
                        'me/clutchy/thread/platform/forge/'
                ]
                entries.findAll { entry ->
                    entry.endsWith('.class')
                            && !entry.startsWith('me/clutchy/thread/platform/fabric/')
                            && !entry.startsWith('me/clutchy/thread/platform/neoforge/')
                            && !entry.startsWith('me/clutchy/thread/platform/forge/')
                }.each { entry ->
                    def bytecode = new String(
                            archive.getInputStream(archive.getEntry(entry)).readAllBytes(),
                            java.nio.charset.StandardCharsets.ISO_8859_1)
                    forbiddenSharedReferences.each { reference ->
                        if (bytecode.contains(reference)) {
                            throw new GradleException(
                                    "Shared class ${entry} eagerly references loader-specific ${reference}")
                        }
                    }
                }

                def fabricMetadata = new groovy.json.JsonSlurper().parse(
                        archive.getInputStream(archive.getEntry('fabric.mod.json')), 'UTF-8')
                def neoForgeMetadata = archive.getInputStream(
                        archive.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
                def forgeMetadata = archive.getInputStream(
                        archive.getEntry('META-INF/mods.toml')).getText('UTF-8')
                if (fabricMetadata.version != project.version.toString()
                        || fabricMetadata.license != 'MIT'
                        || fabricMetadata.depends.minecraft != "=${matrix.minecraftVersion}"
                        || !neoForgeMetadata.contains('license="MIT"')
                        || !neoForgeMetadata.contains(
                            "versionRange=\"[${matrix.neoForgeVersion},)\"")
                        || !neoForgeMetadata.contains(
                            "versionRange=\"[${matrix.minecraftVersion}]\"")
                        || !forgeMetadata.contains(
                            "versionRange=\"[${matrix.forgeVersion.split('-', 2)[1]},)\"")
                        || !forgeMetadata.contains('license="MIT"')
                        || !forgeMetadata.contains(
                            "versionRange=\"[${matrix.minecraftVersion}]\"")) {
                    throw new GradleException(
                            'Universal loader metadata versions are inconsistent.')
                }
            }
        }
    }

    releaseVerificationTasks.addAll([fabricTask, neoForgeTask, forgeTask, universalTask])
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Validates all version-specific universal and dedicated release matrices.'
    dependsOn releaseVerificationTasks
}

tasks.register('releaseBundle') {
    group = 'build'
    description = 'Creates all validated version-specific release matrices with checksums.'
    dependsOn tasks.named('verifyReleaseArtifact')
    inputs.files(releaseMatrices.collectMany { matrix ->
        [matrix.universalJar, matrix.fabricJar, matrix.neoForgeJar, matrix.forgeJar]
    })
    outputs.dir(releaseDirectory)
    doLast {
        def outputDirectory = releaseDirectory.get().asFile
        outputDirectory.deleteDir()
        outputDirectory.mkdirs()
        releaseMatrices.each { matrix ->
            [
                    (matrix.universalReleaseJarName): matrix.universalJar.get().asFile,
                    (matrix.fabricReleaseJarName)   : matrix.fabricJar.get().asFile,
                    (matrix.neoForgeReleaseJarName) : matrix.neoForgeJar.get().asFile,
                    (matrix.forgeReleaseJarName)    : matrix.forgeJar.get().asFile
            ].each { releaseName, sourceJar ->
                def outputJar = new File(outputDirectory, releaseName)
                java.nio.file.Files.copy(
                        sourceJar.toPath(),
                        outputJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(java.nio.file.Files.readAllBytes(outputJar.toPath()))
                def checksum = digest.collect { String.format('%02x', it) }.join()
                new File(outputDirectory, "${releaseName}.sha256")
                        .setText("${checksum}  ${releaseName}\n", 'UTF-8')
            }
        }
    }
}
