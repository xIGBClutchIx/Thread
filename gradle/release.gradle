def fabricProject = project(':fabric')
def neoForgeProject = project(':neoforge')
def forgeProject = project(':forge')
def universalProject = project(':universal')
def fabricJar = fabricProject.tasks.named('jar', Jar).flatMap { it.archiveFile }
def neoForgeJar = neoForgeProject.tasks.named('jar', Jar).flatMap { it.archiveFile }
def forgeJar = forgeProject.tasks.named('jar', Jar).flatMap { it.archiveFile }
def universalJar = universalProject.tasks.named('jar', Jar).flatMap { it.archiveFile }
def releaseDirectory = layout.buildDirectory.dir('release')
def fabricReleaseJarName = "thread-fabric-${project.version}.jar"
def neoForgeReleaseJarName = "thread-neoforge-${project.version}.jar"
def forgeReleaseJarName = "thread-forge-${project.version}.jar"
def universalReleaseJarName = "thread-universal-${project.version}.jar"
def semanticVersionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/

tasks.register('validateReleaseVersion') {
    group = 'verification'
    description = 'Validates the configured release version.'
    doLast {
        if (!(project.version.toString() ==~ semanticVersionPattern)) {
            throw new GradleException(
                    "Configured mod_version '${project.version}' must use MAJOR.MINOR.PATCH.")
        }
    }
}

tasks.register('verifyReleaseVersion') {
    group = 'verification'
    description = 'Verifies that the release tag matches the configured mod version.'
    dependsOn tasks.named('validateReleaseVersion')
    doLast {
        def actualTag = providers.gradleProperty('releaseTag')
                .orElse(providers.environmentVariable('GITHUB_REF_NAME'))
                .getOrNull()
        def expectedTag = "v${project.version}"
        if (actualTag == null) {
            throw new GradleException('Supply -PreleaseTag=v<version> or GITHUB_REF_NAME.')
        }
        if (!(actualTag ==~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)) {
            throw new GradleException("Release tag '${actualTag}' must use vMAJOR.MINOR.PATCH.")
        }
        if (actualTag != expectedTag) {
            throw new GradleException("Release tag ${actualTag} does not match ${expectedTag}.")
        }
    }
}

def requiredSharedEntries = [
        'me/clutchy/thread/core/integration/ThreadIntegration.class',
        'me/clutchy/thread/core/integration/ThreadIntegrationCandidateProvider.class',
        'me/clutchy/thread/core/integration/IntegrationCandidateCatalog.class',
        'me/clutchy/thread/core/integration/extension/IntegrationExtensionPoint.class',
        'me/clutchy/thread/core/integration/extension/IntegrationRecipeProvider.class',
        'me/clutchy/thread/platform/minecraft/integration/MinecraftIntegrationExtensionPoints.class',
        'me/clutchy/thread/platform/minecraft/game/MinecraftGameProvider.class',
        'me/clutchy/thread/runtime/ThreadRuntime.class',
        'me/clutchy/thread/transport/mcp/McpHttpServer.class'
]

def validateArchiveShape = { Set<String> entries, String ownPrefix, Set<String> forbiddenPrefixes ->
    requiredSharedEntries.each { entry ->
        if (!entries.contains(entry)) {
            throw new GradleException("Runtime JAR is missing ${entry}")
        }
    }
    if (entries.any { it.contains('/gametest/') || it.endsWith('.java') }
            || entries.any { entry -> forbiddenPrefixes.any { prefix -> entry.startsWith(prefix) } }) {
        throw new GradleException(
                'Runtime JAR contains test, source, or other-loader implementation content.')
    }
    def integrationPrefix = "${ownPrefix}integration/"
    if (entries.any { it.startsWith(integrationPrefix)
        && it.substring(integrationPrefix.length()).contains('/') }) {
        throw new GradleException('Runtime JAR contains bundled third-party integration content.')
    }
}

tasks.register('verifyFabricReleaseArtifact') {
    group = 'verification'
    description = 'Validates the installable Fabric JAR independently.'
    dependsOn fabricProject.tasks.named('jar'), tasks.named('validateReleaseVersion')
    inputs.file(fabricJar)
    doLast {
        def jarFile = fabricJar.get().asFile
        if (jarFile.name != fabricReleaseJarName) {
            throw new GradleException("Unexpected Fabric runtime JAR name: ${jarFile.name}")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            def entries = archive.entries().collect { it.name }.toSet()
            validateArchiveShape(
                    entries,
                    'me/clutchy/thread/platform/fabric/',
                    [
                            'me/clutchy/thread/platform/neoforge/',
                            'me/clutchy/thread/platform/forge/'
                    ] as Set)
            if (!entries.contains('fabric.mod.json')
                    || !entries.contains('me/clutchy/thread/platform/fabric/ThreadFabricClient.class')
                    || entries.contains('META-INF/neoforge.mods.toml')) {
                throw new GradleException('Fabric runtime identity or loader isolation is incorrect.')
            }
            def metadata = new groovy.json.JsonSlurper().parse(
                    archive.getInputStream(archive.getEntry('fabric.mod.json')), 'UTF-8')
            if (metadata.id != 'thread'
                    || metadata.version != project.version.toString()
                    || metadata.environment != 'client'
                    || metadata.entrypoints != [
                        client: ['me.clutchy.thread.platform.fabric.ThreadFabricClient']
                    ]) {
                throw new GradleException('Fabric runtime metadata identity/version is incorrect.')
            }
            if (metadata.depends != [
                    fabricloader: ">=${project.loader_version}",
                    minecraft   : "=${project.minecraft_version}",
                    java        : '>=25',
                    'fabric-api': ">=${project.fabric_api_version}"
            ]) {
                throw new GradleException('Fabric runtime dependency metadata is incorrect.')
            }
        }
    }
}

tasks.register('verifyNeoForgeReleaseArtifact') {
    group = 'verification'
    description = 'Validates the installable NeoForge JAR independently.'
    dependsOn neoForgeProject.tasks.named('jar'), tasks.named('validateReleaseVersion')
    inputs.file(neoForgeJar)
    doLast {
        def jarFile = neoForgeJar.get().asFile
        if (jarFile.name != neoForgeReleaseJarName) {
            throw new GradleException("Unexpected NeoForge runtime JAR name: ${jarFile.name}")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            def entries = archive.entries().collect { it.name }.toSet()
            validateArchiveShape(
                    entries,
                    'me/clutchy/thread/platform/neoforge/',
                    [
                            'me/clutchy/thread/platform/fabric/',
                            'me/clutchy/thread/platform/forge/'
                    ] as Set)
            def metadataEntry = archive.getEntry('META-INF/neoforge.mods.toml')
            if (metadataEntry == null
                    || !entries.contains(
                        'me/clutchy/thread/platform/neoforge/ThreadNeoForgeClient.class')
                    || entries.contains('fabric.mod.json')) {
                throw new GradleException('NeoForge runtime identity or loader isolation is incorrect.')
            }
            def metadata = archive.getInputStream(metadataEntry).getText('UTF-8')
            [
                    'modLoader="javafml"',
                    'modId="thread"',
                    "version=\"${project.version}\"",
                    'modId="neoforge"',
                    "versionRange=\"[${project.neoforge_version},)\"",
                    'modId="minecraft"',
                    "versionRange=\"[${project.minecraft_version}]\"",
                    'side="CLIENT"'
            ].each { expected ->
                if (!metadata.contains(expected)) {
                    throw new GradleException("NeoForge metadata is missing ${expected}")
                }
            }
        }
    }
}

tasks.register('verifyForgeReleaseArtifact') {
    group = 'verification'
    description = 'Validates the installable Forge JAR independently.'
    dependsOn forgeProject.tasks.named('jar'), tasks.named('validateReleaseVersion')
    inputs.file(forgeJar)
    doLast {
        def jarFile = forgeJar.get().asFile
        if (jarFile.name != forgeReleaseJarName) {
            throw new GradleException("Unexpected Forge runtime JAR name: ${jarFile.name}")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            def entries = archive.entries().collect { it.name }.toSet()
            validateArchiveShape(
                    entries,
                    'me/clutchy/thread/platform/forge/',
                    [
                            'me/clutchy/thread/platform/fabric/',
                            'me/clutchy/thread/platform/neoforge/'
                    ] as Set)
            def metadataEntry = archive.getEntry('META-INF/mods.toml')
            if (metadataEntry == null
                    || !entries.contains('me/clutchy/thread/platform/forge/ThreadForgeClient.class')
                    || entries.contains('fabric.mod.json')
                    || entries.contains('META-INF/neoforge.mods.toml')) {
                throw new GradleException('Forge runtime identity or loader isolation is incorrect.')
            }
            def forgeLoaderVersion = project.forge_version.split('-', 2)[1]
            def metadata = archive.getInputStream(metadataEntry).getText('UTF-8')
            [
                    'modLoader="javafml"',
                    'clientSideOnly=true',
                    'modId="thread"',
                    "version=\"${project.version}\"",
                    'modId="forge"',
                    'mandatory=true',
                    "versionRange=\"[${forgeLoaderVersion},)\"",
                    'modId="minecraft"',
                    "versionRange=\"[${project.minecraft_version}]\"",
                    'side="CLIENT"'
            ].each { expected ->
                if (!metadata.contains(expected)) {
                    throw new GradleException("Forge metadata is missing ${expected}")
                }
            }
        }
    }
}

tasks.register('verifyUniversalReleaseArtifact') {
    group = 'verification'
    description = 'Validates the installable universal JAR and its classloading boundaries.'
    dependsOn universalProject.tasks.named('jar'), tasks.named('validateReleaseVersion')
    inputs.file(universalJar)
    doLast {
        def jarFile = universalJar.get().asFile
        if (jarFile.name != universalReleaseJarName) {
            throw new GradleException("Unexpected universal runtime JAR name: ${jarFile.name}")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            def entryNames = archive.entries().collect { it.name }
            def entries = entryNames.toSet()
            if (entryNames.size() != entries.size()) {
                throw new GradleException('Universal runtime JAR contains duplicate entries.')
            }
            requiredSharedEntries.each { entry ->
                if (!entries.contains(entry)) {
                    throw new GradleException("Universal runtime JAR is missing ${entry}")
                }
            }
            [
                    'fabric.mod.json',
                    'META-INF/neoforge.mods.toml',
                    'META-INF/mods.toml',
                    'pack.mcmeta',
                    'me/clutchy/thread/platform/fabric/ThreadFabricClient.class',
                    'me/clutchy/thread/platform/neoforge/ThreadNeoForgeClient.class',
                    'me/clutchy/thread/platform/forge/ThreadForgeClient.class'
            ].each { entry ->
                if (!entries.contains(entry)) {
                    throw new GradleException("Universal runtime JAR is missing ${entry}")
                }
            }
            if (entries.any { it.contains('/gametest/') || it.endsWith('.java') }) {
                throw new GradleException('Universal runtime JAR contains test or source content.')
            }
            [
                    'me/clutchy/thread/platform/fabric/',
                    'me/clutchy/thread/platform/neoforge/',
                    'me/clutchy/thread/platform/forge/'
            ].each { prefix ->
                def integrationPrefix = "${prefix}integration/"
                if (entries.any { it.startsWith(integrationPrefix)
                    && it.substring(integrationPrefix.length()).contains('/') }) {
                    throw new GradleException(
                            'Universal runtime JAR contains bundled third-party integration content.')
                }
            }

            def forbiddenCommonReferences = [
                    'net/fabricmc/',
                    'net/neoforged/',
                    'net/minecraftforge/',
                    'me/clutchy/thread/platform/fabric/',
                    'me/clutchy/thread/platform/neoforge/',
                    'me/clutchy/thread/platform/forge/'
            ]
            entries.findAll { entry ->
                entry.endsWith('.class')
                        && !entry.startsWith('me/clutchy/thread/platform/fabric/')
                        && !entry.startsWith('me/clutchy/thread/platform/neoforge/')
                        && !entry.startsWith('me/clutchy/thread/platform/forge/')
            }.each { entry ->
                def bytecode = new String(
                        archive.getInputStream(archive.getEntry(entry)).readAllBytes(),
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                forbiddenCommonReferences.each { reference ->
                    if (bytecode.contains(reference)) {
                        throw new GradleException(
                                "Common class ${entry} eagerly references loader-specific ${reference}")
                    }
                }
            }

            def fabricMetadata = new groovy.json.JsonSlurper().parse(
                    archive.getInputStream(archive.getEntry('fabric.mod.json')), 'UTF-8')
            if (fabricMetadata.version != project.version.toString()) {
                throw new GradleException('Universal Fabric metadata version is incorrect.')
            }
            def neoForgeMetadata = archive.getInputStream(
                    archive.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            def forgeMetadata = archive.getInputStream(
                    archive.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!neoForgeMetadata.contains("version=\"${project.version}\"")
                    || !neoForgeMetadata.contains(
                        "versionRange=\"[${project.neoforge_version},)\"")
                    || !forgeMetadata.contains("version=\"${project.version}\"")
                    || !forgeMetadata.contains(
                        "versionRange=\"[${project.forge_version.split('-', 2)[1]},)\"")) {
                throw new GradleException('Universal loader metadata versions are inconsistent.')
            }
        }
    }
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Validates the universal and dedicated release artifacts independently.'
    dependsOn tasks.named('verifyFabricReleaseArtifact'),
            tasks.named('verifyNeoForgeReleaseArtifact'),
            tasks.named('verifyForgeReleaseArtifact'),
            tasks.named('verifyUniversalReleaseArtifact')
}

tasks.register('releaseBundle') {
    group = 'build'
    description = 'Creates all validated universal and dedicated JARs with SHA-256 checksums.'
    dependsOn tasks.named('verifyReleaseArtifact')
    inputs.files(universalJar, fabricJar, neoForgeJar, forgeJar)
    outputs.dir(releaseDirectory)
    doLast {
        def outputDirectory = releaseDirectory.get().asFile
        outputDirectory.deleteDir()
        outputDirectory.mkdirs()
        [
                (universalReleaseJarName): universalJar.get().asFile,
                (fabricReleaseJarName): fabricJar.get().asFile,
                (neoForgeReleaseJarName): neoForgeJar.get().asFile,
                (forgeReleaseJarName): forgeJar.get().asFile
        ].each { releaseName, sourceJar ->
            def outputJar = new File(outputDirectory, releaseName)
            java.nio.file.Files.copy(
                    sourceJar.toPath(),
                    outputJar.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            def digest = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(java.nio.file.Files.readAllBytes(outputJar.toPath()))
            def checksum = digest.collect { String.format('%02x', it) }.join()
            new File(outputDirectory, "${releaseName}.sha256")
                    .setText("${checksum}  ${releaseName}\n", 'UTF-8')
        }
    }
}
