plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
    id 'com.diffplug.spotless' version "${spotless_version}"
}

group = project.maven_group
version = project.mod_version

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
    }
}

apply from: 'gradle/quality.gradle'
apply from: 'gradle/release.gradle'

tasks.register('test') {
    group = 'verification'
    description = 'Runs unit tests in every Thread module.'
    dependsOn ':common:test', ':fabric:test', ':neoforge:test', ':forge:test'
}

tasks.register('runClientGameTest') {
    group = 'verification'
    description = 'Runs the Fabric development client game test.'
    dependsOn ':fabric:runClientGameTest'
}

tasks.register('runNeoForgeClient') {
    group = 'verification'
    description = 'Runs the NeoForge development client.'
    dependsOn ':neoforge:runClient'
}

tasks.register('runForgeClient') {
    group = 'verification'
    description = 'Runs the Forge development client.'
    dependsOn ':forge:runClient'
}

[
        'runProductionClientGameTest',
        'runRestartProductionClientGameTest',
        'runMcpDisabledProductionClientGameTest'
].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn ":fabric:${taskName}"
    }
}

[
        'verifyForgeProductionClientGameTest',
        'verifyForgeRestartProductionClientGameTest',
        'verifyForgeMcpDisabledProductionClientGameTest'
].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn ":forge:${taskName}"
    }
}

[
        'verifyNeoForgeProductionClientGameTest',
        'verifyNeoForgeRestartProductionClientGameTest',
        'verifyNeoForgeMcpDisabledProductionClientGameTest'
].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn ":neoforge:${taskName}"
    }
}
