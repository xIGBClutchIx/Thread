plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'com.diffplug.spotless' version "${spotless_version}"
}

group = project.maven_group
version = project.mod_version

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
    }
}

apply from: 'gradle/quality.gradle'
apply from: 'gradle/release.gradle'

tasks.register('test') {
    group = 'verification'
    description = 'Runs unit tests in every Thread module.'
    dependsOn ':common:test', ':fabric:test'
}

tasks.register('runClientGameTest') {
    group = 'verification'
    description = 'Runs the Fabric development client game test.'
    dependsOn ':fabric:runClientGameTest'
}

[
        'runProductionClientGameTest',
        'runRestartProductionClientGameTest',
        'runMcpDisabledProductionClientGameTest'
].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn ":fabric:${taskName}"
    }
}
